name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Assemble Pages (v3 build + preserved v1, v2 + landing page)
        run: |
          set -e
          touch dist/.nojekyll

          rm -rf pages-out
          if git clone --branch gh-pages --single-branch --depth 1 \
              "https://github.com/${GITHUB_REPOSITORY}.git" pages-out 2>/dev/null; then
            :
          else
            mkdir pages-out
            git -C pages-out init -b gh-pages
          fi

          # One-time migration, safe to leave permanently: the very first
          # gh-pages deploy put the game straight at the root. If a legacy
          # root build is still there and nothing has claimed v1/ yet,
          # freeze it at v1/ before anything else touches the tree. Once
          # v1/ exists this block is a permanent no-op.
          if [ ! -d pages-out/v1 ] && [ -f pages-out/index.html ] && [ -d pages-out/assets ]; then
            mkdir -p pages-out/v1
            cp pages-out/index.html pages-out/v1/index.html
          fi

          # v3 is the only thing this job ever rebuilds. v1/ and v2/ are
          # frozen where they stand — v2's last good build stays exactly
          # as the previous deploy left it, the way v1 was frozen before
          # it. Adding a v4 later means changing only the paths below.
          rm -rf pages-out/v3
          mkdir -p pages-out/v3
          cp -r dist/* pages-out/v3/

          # The landing page is regenerated fresh every deploy from its
          # tracked source, not hand-maintained on the gh-pages branch.
          cp deploy/landing.html pages-out/index.html
          touch pages-out/.nojekyll

          cd pages-out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}" --allow-empty
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
